name: Build JARVIS ULTIMATE 4.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # STEP 1 - DOWNLOAD REPOSITORY

      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2 - INSTALL JAVA 17

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # STEP 3 - INSTALL ANDROID SDK

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # STEP 4 - INSTALL REQUIRED SDK PACKAGES

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      # STEP 5 - SETUP GRADLE 8.9

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # STEP 6 - CHECK PROJECT FILES

      - name: Verify Android Project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "JARVIS project files found."

      # STEP 7 - BUILD DEBUG APK

      - name: Build JARVIS Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      # STEP 8 - UPLOAD APK

      - name: Upload JARVIS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ULTIMATE-4-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
